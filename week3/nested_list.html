<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>중첩 목록 만들기</title>
</head>
<body>
    <!-- <li> 목록 요소-->

    <!-- <ul> 순서가 없는 목록 -->
    <h1>순서가 없는 기본 목록</h1>
    <ul>
        <li>사과</li>
        <li>바나나</li>
        <li>오렌지</li>
    </ul>

    <!-- <ol> 순서가 있는 목록 -->
    <h1>순서가 있는 기본 목록</h1>
    <ol>
        <li>사과</li>
        <li>바나나</li>
        <li>오렌지</li>
    </ol><hr>


    <h1>중첩 목록 만들기</h1>
    <ul>
        <li>과일

            <ol>
                <li>사과</li>
                <li>바나나</li>
                <li>오렌지</li>
            </ol>
        </li>
        <!-- 두번째 목록 -->
         <li>채소
            <ol>
                <li>상추</li>
                <li>치커리</li>
                <li>양배추</li>
            </ol>
         </li>
    </ul>
    
</body>
</html>
