<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
    <script>
        //조건문
        if(273 < 52){
            //표현식 "273 << 52"가 참일 때 실행합니다.
            alert('273 < 52 => true');
        }
        // 프로그램 종료
        alert('프로그램 종료');
    </script>
    
</head>
<body>
    if조건문으로 참과 거짓 판별 <hr>

    <h3>3. 조건문과 반복문</h3>
    <h5>    1_조건문</h5>
    <h5>    2_반복문</h5>
 
</body>
</html>
