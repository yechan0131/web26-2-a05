<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Basic</title>
    <script>
        // 이벤트 연결
        window.onload = function(){
            // 변수 선언
            let image = document.getElementById('image');

            // 속성연결
            
            image.window = 300;
            image.height = 200;
        }
    </script>
</head>

<body>
    <img id = "image">
    

    <hr>
    <h2>03문서 객체 조작</h2>
    <ol>
        <li>글자 조작</li>
        <li>스타일 조작</li>
        <li><b>속성 조작</b></li>
    </ol>

    <p>.3-1 img태그 속성 조작하기
        .3-2 body태그 속성 조작하기
    </p>

</body>

</html>
