<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Basic</title>
    <script>
        // 이벤트 연결
        window.onload = function(){
            // 문서 객체를 선택
            let headers = document.querySelectorAll('h1');
            
            for(let i=0; i<headers.length; i++){
                //변수 선언
                let header = headers[i];

                // 문서 객체를 조직
                header.style.color = 'orange';
                header.style.background = 'red';
                header.innerHTML = 'From JavaScript';

            }
            

            
        };
    </script>
</head>

<body>
    <h1>Header</h1>
    <h1>Header</h1>
    <h1>Header</h1>

    <hr>
    <h2>02문서 객체 선택</h2>
    <h4>3querySelectorAll()메서드를 사용해 문서 객체 여러 개 선택하기</h4>
    <p>. querySelectorAll()메서드는 문서 객체 여러 개 선택해 조작할 수 있음. 
        문서 객체 여러개를 어떤 속성으로 선택하느냐만 다르지 사용방법은 모두 같음.
    </p>

</body>

</html>
